services:
  - type: web
    name: agent-payment-firewall
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.4"
      # PayPal sandbox: one REST app per shop (secrets set in the Render dashboard)
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_TECHMART_CLIENT_ID
        sync: false
      - key: PAYPAL_TECHMART_CLIENT_SECRET
        sync: false
      - key: PAYPAL_GADGETHUB_CLIENT_ID
        sync: false
      - key: PAYPAL_GADGETHUB_CLIENT_SECRET
        sync: false
      - key: PAYPAL_TECHMARTDEALS_CLIENT_ID
        sync: false
      - key: PAYPAL_TECHMARTDEALS_CLIENT_SECRET
        sync: false
      # One webhook per shop app; unset means that shop's webhooks are rejected
      - key: PAYPAL_TECHMART_WEBHOOK_ID
        sync: false
      - key: PAYPAL_GADGETHUB_WEBHOOK_ID
        sync: false
      - key: PAYPAL_TECHMARTDEALS_WEBHOOK_ID
        sync: false
      # LLM provider (OpenAI-compatible)
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      # App
      - key: DEMO_ACCESS_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://agent-payment-firewall.onrender.com
